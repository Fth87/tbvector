name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/fth87/tbvector

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_R2_VIDEO_BASE_URL: ${{ vars.PUBLIC_R2_VIDEO_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck and accessibility check
        run: bun run check

      - name: Build application
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            PUBLIC_R2_VIDEO_BASE_URL=${{ vars.PUBLIC_R2_VIDEO_BASE_URL }}
          cache-from: type=gha

      - name: Validate Compose configuration
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set image output
        id: image
        run: echo "image=${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_R2_VIDEO_BASE_URL=${{ vars.PUBLIC_R2_VIDEO_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR/deploy'"
          scp -i "$HOME/.ssh/deploy_key" deploy/compose.yaml deploy/Caddyfile \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/deploy/"

      - name: Pull and restart release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/deploy_key" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          ssh -i "$HOME/.ssh/deploy_key" "$VPS_USER@$VPS_HOST" \
            "docker network inspect tbvector-edge >/dev/null 2>&1 || docker network create tbvector-edge; cd '$VPS_APP_DIR' && IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file .env -f deploy/compose.yaml pull && IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file .env -f deploy/compose.yaml up -d --remove-orphans; deploy_status=\$?; docker logout ghcr.io >/dev/null 2>&1 || true; exit \$deploy_status"

  smoke-test:
    name: Smoke test production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production homepage
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-connrefused https://tbvector.tech/ >/dev/null
